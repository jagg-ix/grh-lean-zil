name = "GRH"
srcDir = "src"
defaultTargets = ["Lib", "New", "Main", "Zil", "ZilSmoke"]
moreLeanArgs = ["--tstack=400000"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
maxSynthPendingDepth = 3
pp.unicode.fun = true
maxHeartbeats = 4000000

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

[[lean_lib]]
name = "Lib"
globs = ["Lib.+"]

[[lean_lib]]
name = "New"
globs = ["New.+"]

[[lean_lib]]
name = "Main"
roots = ["Statements", "Main"]

[[lean_lib]]
name = "Challenge"
srcDir = ".."

# Upstream ZIL Datalog modules, vendored verbatim at the commit documented in
# ZIL-INTEGRATION.md. The upstream package's Lean 4.31 pin differs from GRH's
# Lean 4.35 pin, so this source-only subset avoids a nested toolchain conflict.
[[lean_lib]]
name = "Zil"
roots = ["Zil"]

# Compile an executable API smoke test as part of the default target set.
[[lean_lib]]
name = "ZilSmoke"
roots = ["Zil.Datalog.Smoke"]
